name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
        extras: [full, minimal]   # minimal = standard library only: the fallback paths
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.extras == 'full'
        run: pip install "./plugins/unistudent[docs,graphs]"
      - run: python -m unittest discover -s tests -v
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && matrix.extras == 'minimal'
        run: |
          pip install uv
          UNISTUDENT_SMOKE=1 python -m unittest discover -s tests -p test_draw.py -v
