name: windows-transcription
# Run by hand (Actions tab, "Run workflow"): a real speech-to-text run on Windows, the way a student's laptop does it:
# faster-whisper on the processor, the "tiny" model, a 4-second synthetic Hebrew clip (made with macOS `say`).
on: workflow_dispatch
jobs:
  transcribe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: choco install ffmpeg -y --no-progress
      - run: python -m pip install faster-whisper
      - name: Transcribe the clip through us.py
        shell: bash
        env:
          UNISTUDENT_HOME: ${{ runner.temp }}/home
          UNISTUDENT_STT_MODEL: tiny
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'EOF'
          import json, os, pathlib, subprocess, sys
          us = [sys.executable, "plugins/unistudent/scripts/us.py"]
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          own = temp / "own" / "Unit 1"
          own.mkdir(parents=True)
          (own / "hebrew-clip.m4a").write_bytes(pathlib.Path("tests/fixtures/hebrew-clip.m4a").read_bytes())
          course = str(temp / "course")

          def call(*args):
              out = subprocess.run(us + list(args) + ["--json"], capture_output=True, text=True, encoding="utf-8")
              print(out.stdout, out.stderr)
              assert out.returncode == 0
              return json.loads(out.stdout)

          call("setup", course, "--name", "Clip", "--language", "he", "--import", str(temp / "own"), "--tier", "official")
          [rec] = call("recordings", "list", "--course", course)["recordings"]
          call("recordings", "approve", "--course", course, rec["path"])
          [transcript] = call("recordings", "transcribe", "--course", course, rec["path"])["transcripts"]
          text = pathlib.Path(transcript).read_text("utf-8")
          print(text)
          assert any("֐" <= ch <= "׿" for ch in text.split("---", 2)[2]), "no Hebrew in the transcript"
          EOF
